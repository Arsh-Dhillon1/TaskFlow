<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>TaskFlow</h1>
            <p>Manage your work, one task at a time.</p>
        </header>

        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
                required
            >
            <button type="submit">Add Task</button>
        </form>

        <h2>My Tasks</h2>
        <ul id="task-list"></ul>

        <p id="message"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
